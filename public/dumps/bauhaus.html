<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dump 02 · Bauhaus</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff8ee;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .nav {
      position: fixed; top: 16px; left: 16px;
      color: rgba(11,7,23,0.5);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.16em;
      text-decoration: none;
    }
    .nav:hover { color: #e64a30; }

    .badge {
      width: 500px;
      height: 720px;
      background: #fff8ee;
      border: 1px solid rgba(11, 7, 23, 0.15);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 60px 120px -20px rgba(11, 7, 23, 0.25);
      color: #0b0717;
    }

    /* Geometric shape composition */
    .shape-circle-coral {
      position: absolute;
      width: 320px; height: 320px;
      background: #e64a30;
      border-radius: 50%;
      top: -120px; right: -100px;
    }
    .shape-square-blue {
      position: absolute;
      width: 200px; height: 200px;
      background: #3d43e0;
      top: 50px; left: -60px;
    }
    .shape-triangle-lime {
      position: absolute;
      width: 0; height: 0;
      border-left: 110px solid transparent;
      border-right: 110px solid transparent;
      border-bottom: 180px solid #c7f73a;
      top: 80px;
      left: 60%;
      transform: rotate(8deg);
    }
    .shape-rect-cyan {
      position: absolute;
      width: 180px; height: 60px;
      background: #3dbed5;
      top: 280px; right: 40px;
      transform: rotate(-6deg);
    }
    .shape-circle-purple-sm {
      position: absolute;
      width: 80px; height: 80px;
      background: #7752e0;
      border-radius: 50%;
      bottom: 220px; left: 40px;
    }
    .shape-square-orange {
      position: absolute;
      width: 60px; height: 60px;
      background: #f18a2e;
      bottom: 180px; right: 80px;
      transform: rotate(15deg);
    }
    .shape-line-ink {
      position: absolute;
      width: 220px; height: 4px;
      background: #0b0717;
      bottom: 150px; left: 50px;
      transform: rotate(-8deg);
    }

    /* Top label */
    .top-label {
      position: absolute;
      top: 26px;
      left: 26px;
      z-index: 10;
      background: #0b0717;
      color: #fff8ee;
      padding: 6px 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }
    .corner-mark {
      position: absolute;
      top: 26px; right: 26px;
      z-index: 10;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #fff8ee;
      background: #0b0717;
      padding: 6px 14px;
    }

    /* Photo block (off-center, bottom-left area) */
    .photo {
      position: absolute;
      width: 200px;
      height: 220px;
      bottom: 200px;
      left: 50px;
      background: #f5efe2;
      border: 4px solid #0b0717;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: rgba(11, 7, 23, 0.4);
      letter-spacing: 0.2em;
      box-shadow: 8px 8px 0 #c7f73a;
    }

    /* Name (giant, vertical-ish, asymmetric) */
    .name-block {
      position: absolute;
      top: 130px;
      left: 40px;
      z-index: 9;
      max-width: 460px;
    }
    .name-eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.24em;
      color: #0b0717;
      margin-bottom: 8px;
      background: #c7f73a;
      display: inline-block;
      padding: 4px 10px;
    }
    .name {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.92;
      margin: 0;
      color: #0b0717;
    }
    .name span {
      color: #e64a30;
    }

    /* Info column (right side, vertical) */
    .info-column {
      position: absolute;
      bottom: 200px;
      right: 36px;
      z-index: 9;
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .info-card {
      background: #fff8ee;
      border: 2px solid #0b0717;
      padding: 10px 12px;
    }
    .info-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: rgba(11, 7, 23, 0.6);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .info-value {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #0b0717;
      letter-spacing: -0.01em;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      background: #0b0717;
      z-index: 7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      color: #fff8ee;
    }
    .bb-title {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .bb-title span { color: #c7f73a; }
    .bb-id {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-align: right;
    }
    .bb-id-num { color: #c7f73a; font-size: 18px; font-weight: 700; display: block; }

    .accepted-stamp {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      background: #c7f73a;
      color: #0b0717;
      padding: 10px 22px;
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.22em;
      border: 3px solid #0b0717;
      z-index: 11;
    }
  </style>
</head>
<body>
  <a href="./" class="nav">← Volver</a>
  <div class="badge">
    <!-- Geometric shapes -->
    <div class="shape-circle-coral"></div>
    <div class="shape-square-blue"></div>
    <div class="shape-triangle-lime"></div>
    <div class="shape-rect-cyan"></div>
    <div class="shape-circle-purple-sm"></div>
    <div class="shape-square-orange"></div>
    <div class="shape-line-ink"></div>

    <!-- Top labels -->
    <div class="top-label">COHORT 01</div>
    <div class="corner-mark">ETH·LIMA</div>

    <!-- Name (asymmetric, off-grid) -->
    <div class="name-block">
      <span class="name-eyebrow">BUILDER · 2026</span>
      <h1 class="name">Tu<br/><span>nombre</span></h1>
    </div>

    <!-- Photo (off-center) -->
    <div class="photo">PHOTO</div>

    <!-- Info column right -->
    <div class="info-column">
      <div class="info-card">
        <div class="info-label">Programa</div>
        <div class="info-value">Bootcamp Ethereum Lima</div>
      </div>
      <div class="info-card">
        <div class="info-label">Chain</div>
        <div class="info-value">Arbitrum</div>
      </div>
      <div class="info-card">
        <div class="info-label">Cohorte</div>
        <div class="info-value">01 · 2026</div>
      </div>
    </div>

    <!-- Accepted stamp -->
    <div class="accepted-stamp">★ ACEPTADO</div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <div class="bb-title">Ethereum<br/><span>Lima</span></div>
      <div class="bb-id">
        MEMBER
        <span class="bb-id-num">#001</span>
      </div>
    </div>
  </div>
</body>
</html>
