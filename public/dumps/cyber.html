<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dump 01 · Dark Cyber</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, rgba(199, 247, 58, 0.08), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(61, 190, 213, 0.08), transparent 50%),
        #0a0612;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    .nav {
      position: fixed;
      top: 16px;
      left: 16px;
      color: rgba(255,255,255,0.5);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-decoration: none;
    }
    .nav:hover { color: #c7f73a; }

    .badge {
      width: 480px;
      height: 720px;
      background: #0e0820;
      border: 1px solid rgba(199, 247, 58, 0.2);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(199, 247, 58, 0.08),
        0 60px 120px -20px rgba(0, 0, 0, 0.7),
        0 0 80px -10px rgba(199, 247, 58, 0.18);
      color: #fffef2;
    }

    /* Grid neón background */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(199, 247, 58, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(199, 247, 58, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 100% 80% at 50% 50%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 100% 80% at 50% 50%, #000 40%, transparent 100%);
    }

    .glow-lime {
      position: absolute;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(199, 247, 58, 0.4), transparent 70%);
      filter: blur(60px);
      top: -80px; left: -80px;
    }
    .glow-cyan {
      position: absolute;
      width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(61, 190, 213, 0.4), transparent 70%);
      filter: blur(50px);
      bottom: -60px; right: -60px;
    }
    .glow-coral {
      position: absolute;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(230, 74, 48, 0.3), transparent 70%);
      filter: blur(50px);
      top: 40%; right: -50px;
    }

    /* Top bar (terminal style) */
    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(199, 247, 58, 0.15);
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      color: rgba(255, 254, 242, 0.65);
    }
    .terminal-dots {
      display: flex; gap: 6px;
    }
    .terminal-dots span {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .terminal-dots span:nth-child(1) { background: #e64a30; }
    .terminal-dots span:nth-child(2) { background: #f18a2e; }
    .terminal-dots span:nth-child(3) { background: #c7f73a; }
    .system-id { color: #c7f73a; }

    /* Main content */
    .main {
      position: relative;
      z-index: 5;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Photo block */
    .photo-block {
      position: relative;
      width: 220px; height: 220px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1130, #0a0612);
      border: 1px solid rgba(199, 247, 58, 0.4);
      box-shadow:
        0 0 0 4px rgba(199, 247, 58, 0.08),
        0 0 40px -8px rgba(199, 247, 58, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(199, 247, 58, 0.5);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
    }
    .photo-block::before {
      content: "";
      position: absolute;
      top: -1px; left: -1px;
      width: 18px; height: 18px;
      border-top: 2px solid #c7f73a;
      border-left: 2px solid #c7f73a;
    }
    .photo-block::after {
      content: "";
      position: absolute;
      bottom: -1px; right: -1px;
      width: 18px; height: 18px;
      border-bottom: 2px solid #c7f73a;
      border-right: 2px solid #c7f73a;
    }

    /* Status row */
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: rgba(255, 254, 242, 0.7);
      text-transform: uppercase;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: #c7f73a;
      border-radius: 50%;
      box-shadow: 0 0 10px #c7f73a;
    }

    /* Name */
    .name {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 4px 0;
      text-align: center;
      line-height: 1.05;
      color: #fffef2;
    }
    .name-prompt {
      color: #c7f73a;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      margin-bottom: -6px;
    }

    /* Info table */
    .info-table {
      width: 100%;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 0;
      margin-top: 6px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      letter-spacing: 0.1em;
    }
    .info-key { color: rgba(255, 254, 242, 0.5); }
    .info-val { color: #fffef2; }
    .info-val.lime { color: #c7f73a; }
    .info-val.cyan { color: #3dbed5; }
    .info-val.coral { color: #ee5a3e; }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 24px;
      border-top: 1px solid rgba(199, 247, 58, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      letter-spacing: 0.22em;
      color: rgba(255, 254, 242, 0.4);
      z-index: 5;
    }
    .footer .lime-dot { color: #c7f73a; }

    /* Decorative chars */
    .deco-char {
      position: absolute;
      font-family: "JetBrains Mono", monospace;
      color: rgba(199, 247, 58, 0.18);
      font-size: 12px;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <a href="./" class="nav">← Volver</a>
  <div class="badge">
    <div class="grid-bg"></div>
    <div class="glow-lime"></div>
    <div class="glow-cyan"></div>
    <div class="glow-coral"></div>

    <span class="deco-char" style="top: 80px; left: 30px;">{</span>
    <span class="deco-char" style="top: 80px; right: 30px;">}</span>
    <span class="deco-char" style="bottom: 120px; left: 28px;">[ ]</span>
    <span class="deco-char" style="bottom: 120px; right: 28px;">+</span>
    <span class="deco-char" style="top: 380px; left: 18px; opacity: 0.3;">$</span>
    <span class="deco-char" style="top: 420px; right: 18px; opacity: 0.3;">_</span>

    <div class="topbar">
      <div class="terminal-dots">
        <span></span><span></span><span></span>
      </div>
      <div>SYSTEM <span class="system-id">// COHORT_01</span></div>
    </div>

    <div class="main">
      <div class="photo-block">PHOTO</div>

      <div class="status">
        <span class="status-dot"></span>
        STATUS · ACCEPTED
      </div>

      <div style="text-align: center;">
        <div class="name-prompt">&gt; INITIALIZE_USER</div>
        <h2 class="name">Tu nombre</h2>
      </div>

      <div class="info-table">
        <div class="info-row">
          <span class="info-key">[ROLE]</span>
          <span class="info-val lime">BUILDER</span>
        </div>
        <div class="info-row">
          <span class="info-key">[PROGRAM]</span>
          <span class="info-val">BOOTCAMP_ETHLIMA_2026</span>
        </div>
        <div class="info-row">
          <span class="info-key">[CHAIN]</span>
          <span class="info-val cyan">ARBITRUM</span>
        </div>
        <div class="info-row">
          <span class="info-key">[STATUS]</span>
          <span class="info-val coral">ONBOARDING</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span><span class="lime-dot">●</span> ETHLIMA.NET</span>
      <span>0x01 · 2026</span>
    </div>
  </div>
</body>
</html>
